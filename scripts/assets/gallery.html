<!doctype html><html><head><meta charset="utf-8"/><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;background:#0a0d11;font-family:ui-monospace,Menlo,monospace}
  .wrap{position:absolute;inset:0;padding:20px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:20px}
  .tile{position:relative;border:1px solid rgba(184,192,200,.18);border-radius:22px;overflow:hidden;
    background:radial-gradient(120% 100% at 30% 0%, #171c22 0%, #0c0f13 70%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 0 60px rgba(0,0,0,.5)}
  .tile .sheen{position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(184,192,200,.5),transparent)}
  .grid{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(184,192,200,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(184,192,200,.05) 1px,transparent 1px);background-size:34px 34px;
    -webkit-mask-image:radial-gradient(80% 80% at 50% 50%,#000,transparent 85%)}
  .lab{position:absolute;left:18px;bottom:16px;font-size:15px;letter-spacing:.14em;color:#c6ccd3}
  .tag{position:absolute;right:16px;top:14px;font-size:12px;letter-spacing:.12em;color:#6ee7ff;border:1px solid rgba(110,231,255,.35);border-radius:999px;padding:4px 10px}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .chip{position:absolute;left:16px;top:14px;font-size:13px;letter-spacing:.1em;color:#c6ccd3;border:1px solid rgba(184,192,200,.28);border-radius:999px;padding:6px 12px;background:rgba(20,24,29,.7)}
</style></head><body>
<div class="wrap">
  <!-- character bust -->
  <div class="tile"><div class="grid"></div><div class="sheen"></div>
    <svg viewBox="0 0 500 500">
      <defs><linearGradient id="ch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7ebef"/><stop offset="1" stop-color="#7f8790"/></linearGradient></defs>
      <g fill="none" stroke="url(#ch)" stroke-width="1.4" opacity=".92">
        <ellipse cx="250" cy="215" rx="96" ry="118"/>
        <path d="M154 200 Q250 250 346 200 M170 160 Q250 205 330 160 M180 250 Q250 300 320 250 M250 100 L250 330"/>
        <path d="M250 100 C185 105 158 165 158 215 C158 300 205 350 250 360 C295 350 342 300 342 215 C342 165 315 105 250 100Z"/>
        <path d="M205 205 q18 -16 36 0 M259 205 q18 -16 36 0" stroke="#6ee7ff" stroke-width="2"/>
        <path d="M250 235 l-14 34 h28Z"/>
      </g>
      <g fill="#c6ccd3"><circle cx="212" cy="208" r="2.6"/><circle cx="288" cy="208" r="2.6"/></g>
    </svg>
    <span class="tag">MESH</span><span class="lab">AI 角色 · CHARACTER</span></div>

  <!-- mechanical gear -->
  <div class="tile"><div class="grid"></div><div class="sheen"></div>
    <svg viewBox="0 0 500 500">
      <defs><radialGradient id="mg" cx="45%" cy="38%"><stop offset="0" stop-color="#dfe4e9"/><stop offset="1" stop-color="#6d747c"/></radialGradient></defs>
      <g transform="translate(250 235)">
        <g fill="none" stroke="url(#mg)" stroke-width="2">
          <circle r="118"/><circle r="150"/>
          <g id="t"></g>
        </g>
        <g fill="none" stroke="url(#mg)" stroke-width="2">
          <!-- teeth -->
          <g>
            <path d="M0 -150 l14 -24 h-28Z"/><path d="M106 -106 l27 -6 l-6 -27Z"/><path d="M150 0 l24 -14 v28Z"/>
            <path d="M106 106 l6 27 l27 -6Z"/><path d="M0 150 l-14 24 h28Z"/><path d="M-106 106 l-27 6 l6 27Z"/>
            <path d="M-150 0 l-24 14 v-28Z"/><path d="M-106 -106 l-6 -27 l-27 6Z"/>
          </g>
          <circle r="54"/><circle r="30"/>
          <path d="M-118 0 h236 M0 -118 v236 M-84 -84 l168 168 M84 -84 l-168 168"/>
        </g>
        <circle r="8" fill="#6ee7ff"/>
      </g>
    </svg>
    <span class="tag">PBR</span><span class="lab">机械模型 · PRODUCT</span></div>

  <!-- architecture -->
  <div class="tile"><div class="grid"></div><div class="sheen"></div>
    <svg viewBox="0 0 500 500">
      <defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6dbe0"/><stop offset="1" stop-color="#6b727a"/></linearGradient></defs>
      <g fill="none" stroke="url(#ar)" stroke-width="1.6" transform="translate(250 260)">
        <!-- iso tower -->
        <path d="M0 -170 L120 -100 L120 90 L0 160 L-120 90 L-120 -100 Z"/>
        <path d="M0 -170 L0 160 M-120 -100 L0 -30 L120 -100 M-120 90 L0 160 L120 90"/>
        <path d="M-120 -40 L0 30 L120 -40 M-120 30 L0 100 L120 30"/>
        <path d="M0 -30 L0 160" opacity=".5"/>
        <g stroke="#6ee7ff" stroke-width="1.4" opacity=".8"><path d="M-70 -60 L-70 40 M60 -70 L60 30"/></g>
      </g>
    </svg>
    <span class="tag">SCENE</span><span class="lab">建筑 / 场景 · SPACE</span></div>

  <!-- creature / low-poly + text→3d chip -->
  <div class="tile"><div class="grid"></div><div class="sheen"></div>
    <svg viewBox="0 0 500 500">
      <defs><linearGradient id="cr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1f4"/><stop offset="1" stop-color="#767d85"/></linearGradient></defs>
      <g fill="none" stroke="url(#cr)" stroke-width="1.5" transform="translate(250 250)">
        <path d="M-120 40 L-60 -70 L20 -110 L110 -50 L120 40 L60 110 L-40 110 Z"/>
        <path d="M-60 -70 L20 40 L110 -50 M20 -110 L20 40 L-120 40 M20 40 L60 110 M20 40 L-40 110"/>
        <path d="M-60 -70 L-40 110 M110 -50 L60 110"/>
        <circle cx="52" cy="-58" r="6" fill="#6ee7ff" stroke="none"/>
      </g>
    </svg>
    <span class="chip">TEXT · IMAGE → 3D</span><span class="lab">生物 / 道具 · CREATURE</span></div>
</div>
</body></html>
