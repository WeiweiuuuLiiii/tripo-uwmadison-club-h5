<!doctype html><html><head><meta charset="utf-8"/><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;background:#080b0e;font-family:ui-monospace,Menlo,monospace;overflow:hidden}
  .floor{position:absolute;left:-10%;right:-10%;bottom:0;height:44%;
    background-image:linear-gradient(rgba(184,192,200,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(184,192,200,.08) 1px,transparent 1px);
    background-size:60px 60px;transform:perspective(700px) rotateX(64deg);transform-origin:bottom center;-webkit-mask-image:linear-gradient(0deg,#000,transparent 80%)}
  .spot{position:absolute;top:-16%;left:50%;transform:translateX(-50%);width:900px;height:520px;background:radial-gradient(closest-side,rgba(110,231,255,.12),transparent 70%);filter:blur(10px)}
  .hd{position:absolute;left:44px;top:36px;color:#8a929e;font-size:15px;letter-spacing:.16em}
  .hd b{color:#6ee7ff;font-weight:400}
  .screen{position:absolute;left:315px;top:96px;width:650px;height:400px;border:1px solid rgba(184,192,200,.26);border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,#0f1418,#0a0e12);box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 6px rgba(20,24,29,.5)}
  .screen .bar{height:34px;border-bottom:1px solid rgba(184,192,200,.12);display:flex;align-items:center;padding:0 14px;gap:7px;color:#8a929e;font-size:12px}
  .screen .bar i{width:9px;height:9px;border-radius:50%;background:rgba(184,192,200,.3)}
  .screen svg{width:100%;height:calc(100% - 34px)}
  .panel{position:absolute;width:230px;border:1px solid rgba(184,192,200,.18);border-radius:14px;background:linear-gradient(180deg,#141a20,#0c1013);padding:16px 16px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
  .panel .k{font-size:12px;letter-spacing:.12em;color:#6ee7ff}
  .panel .row{height:9px;border-radius:3px;background:rgba(184,192,200,.15);margin:10px 0}
  .panel .row.k{background:rgba(110,231,255,.3)}
  .pl{left:44px;top:190px}
  .pr{right:44px;top:150px}
  .pr2{right:44px;top:360px}
  .cap{position:absolute;left:315px;bottom:52px;width:650px;text-align:center;color:#c6ccd3;font-family:-apple-system,"PingFang SC",sans-serif;font-size:18px}
  .tag{position:absolute;font-size:12px;letter-spacing:.12em;color:#aeb6be;border:1px solid rgba(184,192,200,.22);border-radius:6px;padding:4px 9px}
</style></head><body>
  <div class="floor"></div><div class="spot"></div>
  <div class="hd">DEMO DAY · <b>项目公开演示</b></div>

  <div class="panel pl"><div class="k">MODEL</div><div class="row k" style="width:70%"></div><div class="row" style="width:90%"></div><div class="row" style="width:55%"></div>
    <span class="tag" style="right:14px;top:12px">3D</span></div>
  <div class="panel pr"><div class="k">CODE</div><div class="row" style="width:80%"></div><div class="row k" style="width:50%"></div><div class="row" style="width:66%"></div></div>
  <div class="panel pr2"><div class="k">INTERACTION</div><div class="row" style="width:60%"></div><div class="row" style="width:84%"></div></div>

  <div class="screen"><div class="bar"><i></i><i></i><i></i><span>▶ running · ai-3d-world.demo</span></div>
    <svg viewBox="0 0 650 366"><rect width="650" height="366" fill="#0d1216"/>
      <g stroke="rgba(184,192,200,.12)" stroke-width="1"><path d="M0 260 L650 260 M120 366 L230 200 M530 366 L420 200"/></g>
      <g transform="translate(325 175)" fill="none" stroke="#e7ebef" stroke-width="1.4"><ellipse rx="82" ry="100"/>
        <path d="M-82 0 Q0 34 82 0 M-64 -52 Q0 -12 64 -52 M0 -100 L0 104 M-54 60 Q0 100 54 60"/>
        <circle cx="-28" cy="-16" r="3.4" fill="#6ee7ff" stroke="none"/><circle cx="28" cy="-16" r="3.4" fill="#6ee7ff" stroke="none"/></g>
      <circle cx="590" cy="315" r="16" fill="none" stroke="#6ee7ff" stroke-width="2"/><path d="M584 307 L598 315 L584 323 Z" fill="#6ee7ff"/></svg></div>

  <div class="cap">大屏上运行的 AI 3D Demo · 模型 · 代码 · 交互</div>
</body></html>
