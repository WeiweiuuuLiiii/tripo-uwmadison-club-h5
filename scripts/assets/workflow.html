<!doctype html><html><head><meta charset="utf-8"/><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:900px;height:1320px;background:#0a0d11;font-family:ui-monospace,Menlo,monospace}
  .wrap{position:absolute;inset:0;padding:20px;display:grid;grid-template-rows:repeat(4,1fr);gap:18px}
  .fr{position:relative;border:1px solid rgba(184,192,200,.18);border-radius:20px;overflow:hidden;
    background:radial-gradient(120% 120% at 20% 0%,#161b21,#0b0e12 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .grid{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(184,192,200,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(184,192,200,.05) 1px,transparent 1px);background-size:32px 32px}
  .lab{position:absolute;left:20px;bottom:16px;font-size:16px;letter-spacing:.16em;color:#c6ccd3}
  .step{position:absolute;left:20px;top:16px;font-size:13px;letter-spacing:.14em;color:#6ee7ff}
  .desc{position:absolute;right:20px;bottom:18px;font-size:14px;color:#8a929e;font-family:-apple-system,"PingFang SC",sans-serif}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .card{position:absolute;left:150px;top:44px;width:560px;height:150px;border:1px solid rgba(184,192,200,.22);border-radius:14px;background:rgba(18,22,27,.8);padding:18px 20px}
  .card .p{font-family:-apple-system,"PingFang SC",sans-serif;color:#dfe4e9;font-size:20px;letter-spacing:.02em}
  .card .cur{display:inline-block;width:2px;height:20px;background:#6ee7ff;margin-left:2px;vertical-align:-3px}
  .card .ref{position:absolute;right:18px;bottom:16px;width:88px;height:64px;border:1px solid rgba(184,192,200,.3);border-radius:8px;display:grid;place-items:center;color:#7c8794;font-size:11px}
  .bar{position:absolute;left:150px;bottom:22px;width:560px;height:6px;border-radius:6px;background:rgba(184,192,200,.16)}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:78%;border-radius:6px;background:linear-gradient(90deg,#6ee7ff,#3f95a6)}
  .pct{position:absolute;left:150px;bottom:36px;font-size:13px;color:#6ee7ff}
  .panelR{position:absolute;right:16px;top:16px;bottom:16px;width:150px;border:1px solid rgba(184,192,200,.16);border-radius:10px;background:rgba(14,18,22,.7);padding:12px}
  .panelR .row{height:10px;margin:8px 0;border-radius:3px;background:rgba(184,192,200,.14)}
  .panelR .row.on{background:rgba(110,231,255,.35)}
</style></head><body>
<div class="wrap">
  <!-- INPUT -->
  <div class="fr"><div class="grid"></div>
    <div class="card"><div class="p">“ 生成一个赛博风格的机甲角色 ”<span class="cur"></span></div><div class="ref">REF · IMG</div></div>
    <span class="step">01</span><span class="lab">INPUT</span><span class="desc">文字 / 参考图</span></div>

  <!-- GENERATE -->
  <div class="fr"><div class="grid"></div>
    <svg viewBox="0 0 900 300"><g transform="translate(240 150)" fill="none" stroke="#c6ccd3" stroke-width="1.2" opacity=".85">
      <ellipse rx="86" ry="104"/><path d="M-86 0 Q0 40 86 0 M-70 -50 Q0 -10 70 -50 M0 -104 L0 104 M-60 60 Q0 100 60 60"/>
      <circle cx="-30" cy="-16" r="3" fill="#6ee7ff" stroke="none"/><circle cx="30" cy="-16" r="3" fill="#6ee7ff" stroke="none"/></g>
      <g fill="#aeb6be"><circle cx="470" cy="90" r="1.8"/><circle cx="520" cy="150" r="1.8"/><circle cx="560" cy="110" r="1.8"/><circle cx="610" cy="170" r="1.8"/><circle cx="500" cy="210" r="1.8"/><circle cx="640" cy="120" r="1.8"/><circle cx="580" cy="200" r="1.8"/></g>
    </svg>
    <div class="pct">GENERATING · 78%</div><div class="bar"><i></i></div>
    <span class="step">02</span><span class="lab">GENERATE · TRIPO</span></div>

  <!-- REFINE -->
  <div class="fr"><div class="grid"></div>
    <svg viewBox="0 0 900 300"><g transform="translate(300 150)" fill="none" stroke="#d6dbe0" stroke-width="1.1">
      <path d="M-110 -40 L0 -90 L110 -40 L110 60 L0 110 L-110 60 Z"/><path d="M0 -90 L0 110 M-110 -40 L0 10 L110 -40 M-110 60 L0 110 L110 60"/>
      <path d="M-55 -65 L-55 85 M55 -65 L55 85 M-110 10 L110 10"/>
      <g stroke="#6ee7ff" stroke-width="1.4"><path d="M0 -90 L18 -74 M0 -90 L-18 -74"/></g></g></svg>
    <div class="panelR"><div class="row on"></div><div class="row"></div><div class="row"></div><div class="row on"></div><div class="row"></div></div>
    <span class="step">03</span><span class="lab">REFINE · BLENDER</span><span class="desc">拓扑 / 材质</span></div>

  <!-- BUILD -->
  <div class="fr"><div class="grid"></div>
    <svg viewBox="0 0 900 300"><g transform="translate(300 160)" fill="none" stroke="#cfd5da" stroke-width="1.2">
      <path d="M-140 60 L0 120 L140 60 L0 0 Z" opacity=".6"/>
      <path d="M-40 60 L-40 -30 L40 -30 L40 60 M-40 -30 L0 -70 L40 -30" />
      <path d="M0 -70 L0 60"/><rect x="-16" y="10" width="32" height="30" stroke="#6ee7ff"/></g>
      <circle cx="450" cy="150" r="22" fill="none" stroke="#6ee7ff" stroke-width="2"/><path d="M444 140 L462 150 L444 160 Z" fill="#6ee7ff"/></svg>
    <div class="panelR"><div class="row on"></div><div class="row"></div><div class="row on"></div><div class="row"></div><div class="row"></div></div>
    <span class="step">04</span><span class="lab">BUILD · UNITY / UNREAL</span><span class="desc">交互 / Demo</span></div>
</div>
</body></html>
