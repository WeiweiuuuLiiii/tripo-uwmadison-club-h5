<!doctype html><html><head><meta charset="utf-8"/><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1000px;height:900px;background:#0a0d11;font-family:ui-monospace,Menlo,monospace}
  .grid{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(184,192,200,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(184,192,200,.045) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(90% 90% at 50% 45%,#000,transparent 90%)}
  .win{position:absolute;border:1px solid rgba(184,192,200,.2);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#161b21,#0c0f13);box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}
  .bar{height:34px;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid rgba(184,192,200,.12)}
  .bar i{width:9px;height:9px;border-radius:50%;background:rgba(184,192,200,.3)}
  .bar .t{margin-left:8px;font-size:12px;color:#8a929e;letter-spacing:.08em}
  .tag{position:absolute;font-size:12px;letter-spacing:.14em;color:#6ee7ff;border:1px solid rgba(110,231,255,.35);border-radius:999px;padding:5px 11px;background:rgba(10,13,17,.8)}
  /* deck (back) */
  .deck{left:120px;top:70px;width:520px;height:330px}
  .deck .body{padding:26px 28px}
  .deck h3{font-family:-apple-system,"PingFang SC",sans-serif;color:#e9edf2;font-size:26px;font-weight:700}
  .deck .ln{height:9px;border-radius:4px;background:rgba(184,192,200,.16);margin:14px 0;width:80%}
  .deck .ln.s{width:55%}
  /* github (mid) */
  .gh{left:70px;top:300px;width:470px;height:360px}
  .gh .body{display:grid;grid-template-columns:120px 1fr}
  .gh .tree{border-right:1px solid rgba(184,192,200,.1);padding:14px 12px}
  .gh .tree .f{height:9px;margin:9px 0;border-radius:3px;background:rgba(184,192,200,.16)}
  .gh .code{padding:14px 16px}
  .gh .code .c{height:8px;margin:8px 0;border-radius:3px;background:rgba(184,192,200,.13)}
  .gh .code .c.k{background:rgba(110,231,255,.3)}
  /* live demo (front) */
  .demo{right:70px;top:210px;width:470px;height:340px}
  .demo .view{position:relative;height:calc(100% - 34px)}
  .demo svg{position:absolute;inset:0;width:100%;height:100%}
  .hud{position:absolute;left:14px;bottom:12px;font-size:11px;color:#6ee7ff;letter-spacing:.1em}
</style></head><body>
  <div class="grid"></div>

  <div class="win deck"><div class="bar"><i></i><i></i><i></i><span class="t">demo-day-deck.key</span></div>
    <div class="body"><h3>AI 3D · Case Study</h3><div class="ln"></div><div class="ln s"></div><div class="ln"></div></div>
    <span class="tag" style="right:14px;top:44px">PRESENTATION</span></div>

  <div class="win gh"><div class="bar"><i></i><i></i><i></i><span class="t">tripo-club / ai-3d-demo</span></div>
    <div class="body"><div class="tree"><div class="f"></div><div class="f"></div><div class="f"></div><div class="f"></div><div class="f"></div></div>
    <div class="code"><div class="c k" style="width:60%"></div><div class="c" style="width:85%"></div><div class="c" style="width:72%"></div><div class="c k" style="width:48%"></div><div class="c" style="width:90%"></div><div class="c" style="width:66%"></div></div></div>
    <span class="tag" style="left:14px;bottom:14px">GITHUB</span></div>

  <div class="win demo"><div class="bar"><i></i><i></i><i></i><span class="t">▶ live-demo · runtime</span></div>
    <div class="view"><svg viewBox="0 0 470 300"><rect width="470" height="300" fill="#0e1216"/>
      <g transform="translate(235 150)" fill="none" stroke="#dfe4e9" stroke-width="1.3"><ellipse rx="70" ry="86"/><path d="M-70 0 Q0 30 70 0 M-56 -44 Q0 -8 56 -44 M0 -86 L0 90 M-46 52 Q0 86 46 52"/>
      <circle cx="-24" cy="-14" r="3" fill="#6ee7ff" stroke="none"/><circle cx="24" cy="-14" r="3" fill="#6ee7ff" stroke="none"/></g>
      <circle cx="410" cy="250" r="16" fill="none" stroke="#6ee7ff" stroke-width="2"/><path d="M404 242 L418 250 L404 258 Z" fill="#6ee7ff"/></svg>
      <div class="hud">FPS 60 · INTERACTIVE</div></div>
    <span class="tag" style="left:14px;top:44px">LIVE DEMO</span></div>

  <span class="tag" style="right:120px;bottom:60px">CASE STUDY</span>
</body></html>
