<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
        color: #101318;
        background-image:
          radial-gradient(60% 80% at 90% -10%, rgba(118, 215, 244, 0.30), transparent 60%),
          radial-gradient(55% 70% at 4% 8%, rgba(91, 124, 250, 0.12), transparent 60%);
      }
      .grid {
        position: absolute; inset: -8% -6% 0 -6%;
        background-image:
          linear-gradient(rgba(15,23,42,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15,23,42,0.05) 1px, transparent 1px);
        background-size: 46px 46px;
        transform: perspective(1000px) rotateX(60deg) translateY(2%);
        transform-origin: top center;
        -webkit-mask-image: radial-gradient(80% 66% at 50% 16%, #000, transparent 80%);
      }
      .content { position: absolute; inset: 0; padding: 76px 80px; display: flex; flex-direction: column; justify-content: space-between; }
      .top { display: flex; align-items: center; gap: 16px; }
      .badge {
        font-size: 22px; font-weight: 700; letter-spacing: 0.02em;
        color: #101318; background: #ffffff; border: 1px solid rgba(15,23,42,0.1);
        padding: 11px 22px; border-radius: 999px; box-shadow: 0 4px 14px rgba(15,23,42,0.06);
      }
      .season { font-size: 22px; font-weight: 650; letter-spacing: 0.01em; color: #5b7cfa; }
      h1 { font-size: 116px; line-height: 1.0; font-weight: 760; letter-spacing: -0.04em; color: #101318; }
      h1 .g { background: linear-gradient(110deg,#3f5bd4,#5b7cfa 45%,#76d7f4); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .sub { margin-top: 26px; font-size: 33px; font-weight: 600; color: #626a76; letter-spacing: 0.01em; }
      .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
      .school { font-size: 30px; font-weight: 700; color: #101318; letter-spacing: 0.01em; }
      .school small { display:block; font-size: 18px; font-weight: 600; color: #8a929e; margin-top: 7px; }
      /* glass / silver cube cluster */
      .cubes { position: absolute; right: 74px; top: 150px; width: 360px; height: 340px; }
      .cube { position: absolute; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="cubes">
      <div class="cube" style="left:120px; top:0;">
        <svg width="238" height="258" viewBox="0 0 230 250">
          <defs>
            <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
              <stop offset="1" stop-color="#76d7f4" stop-opacity="0.18"/>
            </linearGradient>
          </defs>
          <path d="M115 20 L200 68 L200 168 L115 216 L30 168 L30 68 Z" fill="url(#face)"/>
          <g fill="none" stroke="#5b7cfa" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.85">
            <path d="M115 20 L200 68 L200 168 L115 216 L30 168 L30 68 Z"/>
            <path d="M115 20 L115 118 M115 118 L200 68 M115 118 L30 68 M115 118 L115 216"/>
          </g>
        </svg>
      </div>
      <div class="cube" style="left:0; top:126px; opacity:0.55;">
        <svg width="150" height="165" viewBox="0 0 230 250">
          <g fill="none" stroke="rgba(16,19,24,0.4)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
            <path d="M115 20 L200 68 L200 168 L115 216 L30 168 L30 68 Z"/>
            <path d="M115 20 L115 118 M115 118 L200 68 M115 118 L30 68 M115 118 L115 216"/>
          </g>
        </svg>
      </div>
      <div class="cube" style="left:214px; top:206px;">
        <svg width="52" height="52" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#5b7cfa"/></svg>
      </div>
    </div>
    <div class="content">
      <div class="top">
        <span class="badge">TRIPO AI 3D</span>
        <span class="season">2026 秋季招新</span>
      </div>
      <div>
        <h1>从一句话，<br/>到一个<span class="g">三维世界</span></h1>
        <div class="sub">做真实 Demo · 进入长期项目 · 获得 AI 3D 创作资源</div>
      </div>
      <div class="bottom">
        <div class="school">UW–Madison<small>TRIPO AI 3D Club</small></div>
      </div>
    </div>
  </body>
</html>
