<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #080a0d;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
        color: #e9edf2;
      }
      .grid {
        position: absolute; inset: -8% -6% 0 -6%;
        background-image:
          linear-gradient(rgba(184,192,200,0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(184,192,200,0.07) 1px, transparent 1px);
        background-size: 48px 48px;
        transform: perspective(1100px) rotateX(60deg) translateY(2%);
        transform-origin: top center;
        -webkit-mask-image: radial-gradient(80% 66% at 50% 14%, #000, transparent 82%);
      }
      .halo { position:absolute; top:-14%; right:-8%; width:640px; height:640px; border-radius:50%;
        background: radial-gradient(circle at 50% 50%, rgba(110,231,255,0.16), rgba(53,59,67,0.14) 40%, transparent 66%); filter: blur(28px); }
      canvas.cloud { position:absolute; right:44px; top:70px; width:470px; height:470px; }
      .content { position: absolute; inset: 0; padding: 74px 80px; display: flex; flex-direction: column; justify-content: space-between; }
      .top { display: flex; align-items: center; gap: 16px; }
      .badge { font-size: 22px; font-weight: 700; letter-spacing: 0.01em; color: #e9edf2; background: linear-gradient(180deg,#2b3138,#14181d);
        border: 1px solid rgba(184,192,200,0.28); padding: 11px 22px; border-radius: 999px; }
      .season { font-family: ui-monospace, Menlo, monospace; font-size: 21px; letter-spacing: 0.06em; color: #6ee7ff; }
      h1 { font-size: 112px; line-height: 0.98; font-weight: 750; letter-spacing: -0.04em; color: #f4f7fa; }
      h1 .g { background: linear-gradient(180deg,#ffffff,#b8c0c8 60%,#7f8790); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .sub { margin-top: 26px; font-size: 32px; font-weight: 600; color: #b8c0c8; letter-spacing: 0.01em; }
      .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
      .school { font-size: 30px; font-weight: 700; color: #e9edf2; }
      .school small { display:block; font-family: ui-monospace, Menlo, monospace; font-size: 17px; letter-spacing:0.12em; color: #7c8794; margin-top: 8px; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="halo"></div>
    <canvas class="cloud" width="940" height="940"></canvas>
    <div class="content">
      <div class="top">
        <span class="badge">TRIPO AI 3D</span>
        <span class="season">2026 秋季招新</span>
      </div>
      <div>
        <h1>从一句话，<br/>到一个<span class="g">三维世界</span></h1>
        <div class="sub">做真实 Demo · 进入长期项目 · 获得 AI 3D 创作资源</div>
      </div>
      <div class="bottom">
        <div class="school">UW–Madison<small>TRIPO AI 3D Club</small></div>
      </div>
    </div>
    <script>
      // point-cloud sphere (matches the hero visual)
      const c = document.querySelector('canvas.cloud'), x = c.getContext('2d');
      const N = 460, pts = [], gold = Math.PI*(3-Math.sqrt(5));
      for (let i=0;i<N;i++){ const y=1-(i/(N-1))*2, r=Math.sqrt(1-y*y), t=gold*i; pts.push({x:Math.cos(t)*r,y,z:Math.sin(t)*r,ice:i%15===0}); }
      const W=c.width,H=c.height,cx=W/2,cy=H/2,R=Math.min(W,H)*0.42, a=0.5, ca=Math.cos(a),sa=Math.sin(a),tc=Math.cos(-0.42),ts=Math.sin(-0.42);
      const proj = pts.map(p=>{let X=p.x*ca-p.z*sa,Z=p.x*sa+p.z*ca,Y=p.y;const y2=Y*tc-Z*ts,z2=Y*ts+Z*tc;Y=y2;Z=z2;const d=(Z+1)/2;return{sx:cx+X*R,sy:cy+Y*R,d,ice:p.ice};}).sort((m,n)=>m.d-n.d);
      x.lineWidth=1.4;
      for(let i=0;i<proj.length;i+=3){const A=proj[i],B=proj[Math.min(proj.length-1,i+7)];const dx=A.sx-B.sx,dy=A.sy-B.sy;if(dx*dx+dy*dy<90*90){x.strokeStyle='rgba(184,192,200,'+(0.05+A.d*0.10)+')';x.beginPath();x.moveTo(A.sx,A.sy);x.lineTo(B.sx,B.sy);x.stroke();}}
      for(const p of proj){const s=1.2+p.d*3.2,al=0.18+p.d*0.72;if(p.ice){x.fillStyle='rgba(110,231,255,'+Math.min(1,al+0.2)+')';x.shadowColor='rgba(110,231,255,0.7)';x.shadowBlur=10;}else{x.fillStyle='rgba(214,220,226,'+al+')';x.shadowBlur=0;}x.beginPath();x.arc(p.sx,p.sy,s,0,Math.PI*2);x.fill();}
    </script>
  </body>
</html>
